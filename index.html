<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1, viewport-fit=cover"
    />
    <meta name="theme-color" content="#294172" />
    <link rel="icon" href="favicon.svg" type="image/svg+xml" />
    <meta property="og:type" content="website" />
    <meta property="og:title" content="Pj B., Software Developer | Python, Web Development & Automation" />
    <meta
      property="og:description"
      content="Interactive desktop portfolio of Pj B., with a file manager, terminal and more, all in the browser."
    />
    <meta name="twitter:card" content="summary" />
    <title>Pj B., Software Developer | Python, Web Development & Automation</title>
    <meta
      name="description"
      content="Interactive desktop portfolio of Pj B., with a file manager, terminal and more, all in the browser."
    />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@400;700&family=Noto+Sans:wght@400;600;700&display=swap"
      rel="stylesheet"
    />
    <link rel="stylesheet" href="style.css" />
  </head>
  <body data-theme="dusk">
    <noscript
      ><p style="position: relative; z-index: 5; padding: 2rem">
        This portfolio is an interactive desktop and needs JavaScript.
      </p></noscript
    >

    <div id="wall" aria-hidden="true">
      <div class="par stars" style="--k: 3"></div>
      <div class="par sun" style="--k: 5"></div>
      <div class="par ridge r1"></div>
      <div class="par ridge r2"></div>
      <div class="par ridge r3"></div>
      <div class="par ridge r4"></div>
    </div>

    <div id="desk"><nav id="icons" aria-label="Desktop"></nav></div>

    <div id="menu" hidden></div>
    <footer id="bar">
      <button id="start" type="button" aria-haspopup="true">Start</button>
      <div id="tasks"></div>
      <div id="clock"></div>
    </footer>

    <div id="boot" role="status" aria-label="Starting up">
      <canvas id="bootBg"></canvas>
      <div id="bootBox">
        <canvas id="bootLogo" aria-hidden="true"></canvas>
        <div id="bootLog" aria-hidden="true"></div>
        <div id="bootBar" aria-hidden="true"></div>
        <button id="bootSkip" type="button">Press any key to skip</button>
      </div>
    </div>
    <noscript
      ><style>
        #boot {
          display: none;
        }
      </style></noscript
    >

    <script src="script.js"></script>
  </body>
</html>
